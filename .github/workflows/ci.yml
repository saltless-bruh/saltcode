name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend:
    name: Backend (ruff · pyright --strict · pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: saltcode_backend

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: saltcode_backend/pyproject.toml

    # The Task 3 containment suite skips when no backend is usable, so without
    # this the security tests would pass by not running (REQ-SEC-001/005).
    - name: Install bubblewrap (security container backend)
      run: sudo apt-get update && sudo apt-get install -y bubblewrap

    # Ubuntu 24.04 (which `ubuntu-latest` now is) ships an AppArmor profile that
    # blocks unprivileged user namespaces, so an installed `bwrap` cannot create
    # one. Detection then correctly refuses — it will not claim a containment it
    # cannot deliver (G-C07) — and the containment step below exits 3, killing the
    # job before ruff/pyright/pytest run at all. That is what left this lane red on
    # every push since 2026-07-27 (G-016).
    #
    # This lifts the restriction for the runner only. It does NOT weaken what is
    # being tested: bwrap still creates a real namespace with the same bind layout,
    # and REQ-SEC-005's refuse-if-no-backend path stays intact — remove this step
    # and the job goes back to failing closed, which is the behaviour Task 3 wanted.
    - name: Allow unprivileged user namespaces (bubblewrap needs them)
      run: |
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 \
          || echo "sysctl not present on this runner; continuing to the containment probe"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Report the containment backend in use
      run: python -m saltcode.tools.sandbox_apply --check-containment

    - name: Run Ruff Linter
      run: ruff check .

    - name: Run Pyright Type Checker
      run: pyright

    - name: Run Tests
      run: pytest -q

  extension:
    name: Extension (tsc --noEmit · biome)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Type-check the extension
      run: npm run typecheck

    - name: Lint and format check
      run: npm run lint

name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend:
    name: Backend (ruff · pyright --strict · pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: saltcode_backend

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: saltcode_backend/pyproject.toml

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run Ruff Linter
      run: ruff check .

    - name: Run Pyright Type Checker
      run: pyright

    - name: Run Tests
      run: pytest -q

  extension:
    name: Extension (tsc --noEmit · biome)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Type-check the extension
      run: npm run typecheck

    - name: Lint and format check
      run: npm run lint

[project]
name = "saltcode-backend"
version = "0.1.0"
description = "Saltcode backend — typed contracts, gates, sandbox, caches and stability for the Saltcode Pi Package"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.0",
    "lancedb>=0.12.0",
    "pyarrow>=15.0.0",
    # Upper bound is load-bearing, not caution: mcp 2.0 removed `mcp.server.fastmcp`
    # (renamed to `mcp.server.mcpserver`), which `saltcode/mcp/lsp_ast_server.py`
    # imports. The floor was previously unbounded, so a fresh install resolved 2.0.0
    # and broke collection of both Task 4 test modules — invisibly, because CI died
    # earlier still (G-012, G-016). Lift this only together with a port to the 2.0 API.
    "mcp>=1,<2",
    "httpx>=0.25.0",
    "json-repair>=0.25.0",
    # Needed by contracts/tasks.py for the depends_on acyclicity check
    # (REQ-CON-003 AC2, REQ-PLN-002 AC1). Task 0.1's dependency list omits it —
    # see "Dependency notes" in README.md.
    "networkx>=3.0",
]

# Dropped in v9: typer / rich / textual (Pi owns the UI, REQ-EXT-008) and the
# `openai` SDK (providers/local.py speaks OpenAI-compatible HTTP over httpx
# directly, so the SDK was never imported).

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "pyright>=1.1.350"
]

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "saltcode",
    "saltcode.contracts",
    "saltcode.diffs",
    "saltcode.harness",
    "saltcode.mcp",
    "saltcode.memory",
    "saltcode.providers",
    "saltcode.static_gate",
    "saltcode.stability",
    "saltcode.tools",
]

[tool.ruff]
line-length = 120
target-version = "py311"
# tests/fixtures is a sample target repo used as LSP/AST test *data*, not Saltcode
# source. Its exact layout is asserted on (tests/test_task_4.py checks symbol line
# numbers), so reformatting it would break the suite.
exclude = [".venv", "tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "RET", "SIM", "ARG"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Test doubles must mirror the signature of what they replace (LLMClient.chat,
# httpx.Client.post) even where they ignore an argument. Renaming the unused
# params to satisfy ARG would break keyword-argument compatibility.
"tests/**" = ["ARG001", "ARG002"]

[tool.pyright]
include = ["saltcode"]
exclude = ["**/node_modules", "**/__pycache__"]
typeCheckingMode = "strict"
pythonVersion = "3.11"
useLibraryCodeForTypes = true
reportMissingImports = true
reportMissingTypeStubs = false
# The virtualenv lives at the repository root, one level above this package.
venvPath = ".."
venv = ".venv"

[project]
name = "saltcode"
version = "0.1.0"
description = "Pi-Optimized AI-Driven Coding Framework"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.0",
    "lancedb>=0.12.0",
    "mcp>=0.1.0",
    "openai>=1.0.0",
    "httpx>=0.25.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "json-repair>=0.25.0",
    "networkx>=3.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "pyright>=1.1.350"
]
tui = [
    "textual>=0.50.0"
]

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["saltcode"]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [".agents", "workspace", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "RET", "SIM", "ARG"]
ignore = []

[tool.pyright]
include = ["saltcode"]
exclude = ["**/node_modules", "**/__pycache__", "workspace"]
typeCheckingMode = "strict"
pythonVersion = "3.11"
useLibraryCodeForTypes = true
reportMissingImports = true
reportMissingTypeStubs = false

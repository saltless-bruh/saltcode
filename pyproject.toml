[project]
name = "saltcode"
version = "0.1.0"
description = "Pi-Optimized AI-Driven Coding Framework"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.0",
    "lancedb>=0.12.0",
    "mcp>=0.1.0",
    "openai>=1.0.0",
    "httpx>=0.25.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "json-repair>=0.25.0",
    "networkx>=3.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "pyright>=1.1.350"
]
tui = [
    "textual>=0.50.0"
]

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["saltcode"]

[tool.ruff]
line-length = 120
target-version = "py311"
# tests/fixtures is a sample target repo used as LSP/AST test *data*, not Saltcode
# source. Its exact layout is asserted on (tests/test_task_4.py checks symbol line
# numbers), so reformatting it would break the suite.
exclude = [".agents", "workspace", ".venv", "tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "RET", "SIM", "ARG"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Test doubles must mirror the signature of what they replace (LLMClient.chat,
# httpx.Client.post) even where they ignore an argument. Renaming the unused
# params to satisfy ARG would break keyword-argument compatibility.
"tests/**" = ["ARG001", "ARG002"]

[tool.pyright]
include = ["saltcode"]
exclude = ["**/node_modules", "**/__pycache__", "workspace"]
typeCheckingMode = "strict"
pythonVersion = "3.11"
useLibraryCodeForTypes = true
reportMissingImports = true
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv"
